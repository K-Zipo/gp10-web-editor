<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GP-10 Editor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root {
  --base: #2a2c30;
  --panel: #33363b;
  --panel-hi: #3b3f45;
  --rail: #1e2023;
  --line: #474b52;
  --ink: #e8e4da;
  --muted: #9a9da3;
  --faint: #6d7178;
  --mustard: #e2a72e;
  --mustard-ink: #1e1a10;
  --danger: #f07a6a;
  --ok: #7fcf8e;
  --c-model: #e2a72e;
  --c-normal: #c9b98f;
  --c-amp: #e8604c;
  --c-fx: #a487e8;
  --c-wah: #db62ae;
  --c-chorus: #56a8e6;
  --c-delay: #63c274;
  --c-reverb: #ec9840;
  --c-eq: #9aa5b5;
  --c-ns: #45bfae;
  --c-fv: #b8ab8a;
  --c-patch: #d9d4c7;
  --knob-body: #17181a;
  --font: "Barlow Semi Condensed", "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
  --lcd: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--base); color: var(--ink); font: 500 15px/1.35 var(--font); font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--mustard); outline-offset: 2px; }
[hidden] { display: none !important; }

.app { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; grid-template-columns: minmax(0, 1fr); height: 100%; }

/* ---------- top bar ---------- */
.top { display: flex; align-items: center; gap: 14px; padding: 10px 16px; background: var(--rail); border-bottom: 1px solid #000; flex-wrap: wrap; }
.brand { font-weight: 700; font-size: 18px; letter-spacing: .01em; white-space: nowrap; }
.brand span { color: var(--mustard); }
.lcd { display: flex; align-items: center; gap: 12px; padding: 5px 12px 5px 10px; border-radius: 4px; background: #0f1011; box-shadow: inset 0 0 0 1px #000, inset 0 0 0 3px #2b2d30; min-width: 0; }
.lcd .no { font: 700 20px/1 var(--lcd); color: var(--mustard); min-width: 2ch; }
.lcd input { font: 500 18px/1 var(--lcd); letter-spacing: .08em; background: transparent; border: 0; color: #f3ead2; width: 13ch; padding: 4px 2px; }
.lcd input:focus { outline: none; box-shadow: 0 1px 0 var(--mustard); }
.lcd input::placeholder { color: var(--faint); }
.spacer { flex: 1; }
.tbtn { background: transparent; border: 1px solid var(--line); border-radius: 6px; padding: 6px 12px; font-weight: 600; font-size: 14px; color: var(--ink); white-space: nowrap; }
.tbtn:hover:not(:disabled) { border-color: var(--muted); }
.tbtn:disabled { opacity: .4; cursor: default; }
.tbtn.primary { background: var(--mustard); border-color: var(--mustard); color: var(--mustard-ink); }
.toggle { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; color: var(--muted); white-space: nowrap; cursor: pointer; user-select: none; }
.toggle input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.toggle .sw { width: 30px; height: 16px; border-radius: 8px; background: var(--line); position: relative; transition: background .15s; }
.toggle .sw::after { content: ''; position: absolute; top: 2px; left: 2px; width: 12px; height: 12px; border-radius: 50%; background: var(--ink); transition: transform .15s; }
.toggle input:checked + .sw { background: var(--mustard); }
.toggle input:checked + .sw::after { transform: translateX(14px); background: var(--mustard-ink); }
.toggle input:focus-visible + .sw { outline: 2px solid var(--mustard); outline-offset: 2px; }
.pop { position: relative; }
.pop-panel { position: absolute; right: 0; top: calc(100% + 8px); z-index: 30; width: 300px; padding: 14px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 12px 40px rgba(0,0,0,.45); display: grid; gap: 10px; }
.pop-panel label { display: grid; gap: 4px; font-size: 13px; color: var(--muted); }
.pop-panel select, .pop-panel input { background: var(--rail); border: 1px solid var(--line); border-radius: 5px; padding: 6px 8px; }
.pop-panel p { margin: 0; font-size: 13px; color: var(--muted); }

/* ---------- layout ---------- */
.body { display: grid; grid-template-columns: 228px minmax(0, 1fr); min-height: 0; }
.patches { background: var(--rail); border-right: 1px solid #000; display: flex; flex-direction: column; min-height: 0; }
.patches-head { display: flex; gap: 8px; align-items: center; padding: 12px 12px 8px; }
.patches-head h2 { margin: 0; font-size: 15px; font-weight: 700; flex: 1; }
.patches-head button { font-size: 13px; padding: 4px 10px; }
.search { margin: 0 12px 8px; background: var(--base); border: 1px solid var(--line); border-radius: 5px; padding: 5px 9px; font-size: 14px; }
.plist { list-style: none; margin: 0; padding: 0 0 12px; overflow: auto; flex: 1; }
.plist li { display: grid; grid-template-columns: 26px 1fr; gap: 8px; padding: 5px 12px; font-size: 14px; cursor: pointer; border-left: 3px solid transparent; white-space: nowrap; }
.plist li:hover { background: #26282b; }
.plist li .n { color: var(--faint); text-align: right; }
.plist li.cur { border-left-color: var(--mustard); background: #2c2a22; color: #fff; }
.plist li.cur .n { color: var(--mustard); }
.plist .hint { color: var(--muted); font-size: 13px; padding: 4px 12px 0; cursor: default; display: block; border: 0; white-space: normal; }
.plist .hint:hover { background: none; }

.work { display: grid; grid-template-rows: auto minmax(0, 1fr); grid-template-columns: minmax(0, 1fr); min-height: 0; min-width: 0; }

/* ---------- signal rail ---------- */
.railwrap { padding: 18px 18px 14px; border-bottom: 1px solid #000; overflow-x: auto; background: linear-gradient(#2e3034, var(--base)); }
.rail { display: grid; grid-auto-columns: max-content; grid-template-rows: auto auto; column-gap: 0; row-gap: 10px; align-items: center; width: max-content; }
.seg { height: 2px; background: #5a5e66; width: 10px; align-self: center; }
.tile { position: relative; width: 80px; height: 74px; border-radius: 9px; background: var(--panel); border: 1px solid #000; box-shadow: inset 0 1px 0 rgba(255,255,255,.06); padding: 12px 9px 8px; display: flex; flex-direction: column; justify-content: flex-end; gap: 2px; cursor: pointer; user-select: none; text-align: left; transition: transform .12s, box-shadow .12s; }
.tile::before { content: ''; position: absolute; left: 8px; right: 28px; top: 8px; height: 3px; border-radius: 2px; background: #45484e; }
.tile.on::before { background: var(--cat); box-shadow: 0 0 8px var(--cat); }
.tile .ab { font-weight: 700; font-size: 16px; letter-spacing: .02em; color: var(--ink); }
.tile .md { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tile.off .ab { color: var(--faint); }
.tile.sel { box-shadow: 0 0 0 2px var(--mustard), inset 0 1px 0 rgba(255,255,255,.06); transform: translateY(-2px); background: var(--panel-hi); }
.tile .pw { position: absolute; right: 3px; top: 1px; width: 22px; height: 22px; border-radius: 50%; border: 0; background: transparent; color: var(--faint); display: grid; place-items: center; padding: 0; }
.tile .pw:hover { color: var(--ink); background: rgba(255,255,255,.06); }
.tile.on .pw { color: var(--cat); }
.tile .pw svg { width: 13px; height: 13px; }
.tile.dragging { opacity: .35; }
.tile.drop-before { box-shadow: -4px 0 0 0 var(--mustard); }
.node { position: relative; width: 46px; height: 16px; display: grid; place-items: center; font-size: 12px; color: var(--muted); cursor: grab; background: none; border: 0; padding: 0; }
.node i { width: 14px; height: 14px; transform: rotate(45deg); border: 2px solid #8a8e96; background: var(--rail); display: block; }
.node span { position: absolute; bottom: 22px; left: -6px; right: -6px; text-align: center; }
.node.mixer { cursor: pointer; }
.node.mixer:hover i, .node.sel i { border-color: var(--mustard); }
.node.sel { color: var(--mustard); }
.endcap { font-size: 13px; color: var(--faint); padding: 0 4px 0 6px; }
.lane { height: 2px; background: #5a5e66; align-self: center; }
.elbow { justify-self: start; align-self: center; width: calc(50% + 1px); height: 86px; transform: translateY(-42px); border-right: 2px solid #5a5e66; border-bottom: 2px solid #5a5e66; border-bottom-right-radius: 10px; }
.railnote { font-size: 12px; color: var(--faint); margin-top: 10px; }

/* ---------- inspector ---------- */
.inspector { display: grid; grid-template-columns: minmax(0, 1fr) 236px; min-height: 0; }
.insp-main { display: flex; flex-direction: column; min-height: 0; }
.insp-head { display: flex; align-items: center; gap: 14px; padding: 14px 18px 12px; flex-wrap: wrap; border-bottom: 1px solid #23252a; }
.insp-title { display: flex; align-items: baseline; gap: 12px; min-width: 0; }
.insp-title .bar { width: 4px; height: 26px; border-radius: 2px; background: var(--cat, var(--muted)); align-self: center; }
.insp-title h2 { margin: 0; font-size: 22px; font-weight: 700; }
.insp-title .model { font-size: 17px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.power { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 4px 12px 4px 5px; font-weight: 700; font-size: 13px; color: var(--muted); }
.power i { width: 16px; height: 16px; border-radius: 50%; background: #45484e; }
.power.on { color: var(--ink); border-color: var(--cat); }
.power.on i { background: var(--cat); box-shadow: 0 0 8px var(--cat); }
.views { display: flex; gap: 2px; margin-left: auto; background: var(--rail); border-radius: 7px; padding: 3px; }
.views button { border: 0; background: transparent; color: var(--muted); padding: 5px 12px; border-radius: 5px; font-weight: 600; font-size: 14px; white-space: nowrap; }
.views button:hover { color: var(--ink); }
.views button.sel { background: var(--panel-hi); color: var(--ink); }
.ctls { flex: 1; overflow: auto; padding: 16px 18px 22px; display: flex; flex-wrap: wrap; gap: 18px 26px; align-content: flex-start; }
.group { display: grid; gap: 10px; align-content: start; }
.group > h3 { margin: 0; font-size: 13px; font-weight: 600; color: var(--muted); border-bottom: 1px solid #3a3d43; padding-bottom: 5px; }
.group .row { display: flex; flex-wrap: wrap; gap: 14px 6px; }
.ctl { width: 84px; display: grid; justify-items: center; gap: 3px; text-align: center; position: relative; }
.ctl .v { font-size: 14px; font-weight: 600; min-height: 18px; white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
.ctl .n { font-size: 12.5px; color: var(--muted); line-height: 1.2; max-width: 100%; overflow-wrap: anywhere; }
.ctl.dirty .v { color: var(--mustard); }
.knob { width: 58px; height: 58px; touch-action: none; cursor: ns-resize; border-radius: 50%; }
.knob svg { width: 100%; height: 100%; display: block; overflow: visible; }
.knob .trk { stroke: #17181a; }
.knob .val { stroke: var(--cat, var(--mustard)); }
.knob:focus-visible { outline-offset: 0; }
.ctl input.edit { position: absolute; top: 20px; left: 4px; width: 76px; text-align: center; background: var(--rail); border: 1px solid var(--mustard); border-radius: 4px; padding: 3px; font-size: 14px; }
.ctl.wide { width: 176px; justify-items: stretch; text-align: left; padding-top: 31px; }
.ctl.wide .selbox { margin-bottom: 10px; }
.ctl.wide .n { text-align: left; }
.selbox { position: relative; }
.selbox select { appearance: none; -webkit-appearance: none; width: 100%; background: #0f1011; border: 1px solid #000; box-shadow: inset 0 0 0 2px #2b2d30; border-radius: 4px; color: #f3ead2; font: 500 14px/1.2 var(--lcd); padding: 9px 26px 9px 10px; cursor: pointer; }
.selbox::after { content: ''; position: absolute; right: 10px; top: 50%; width: 6px; height: 6px; border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted); transform: translateY(-70%) rotate(45deg); pointer-events: none; }
.ctl.sw { justify-items: center; }
.swbtn { width: 46px; height: 58px; border-radius: 8px; border: 1px solid #000; background: linear-gradient(#3b3e44, #2a2c30); display: grid; place-items: center; padding: 0; }
.swbtn i { width: 12px; height: 12px; border-radius: 50%; background: #45484e; }
.swbtn[aria-pressed="true"] i { background: var(--cat, var(--mustard)); box-shadow: 0 0 8px var(--cat, var(--mustard)); }

/* model browser */
.browser { border-left: 1px solid #000; background: var(--rail); overflow: auto; padding: 14px 0 20px; }
.browser h3 { margin: 0 0 6px; padding: 0 14px; font-size: 13px; font-weight: 600; color: var(--muted); }
.browser h3 + ul { margin-bottom: 16px; }
.browser ul { list-style: none; margin: 0; padding: 0; }
.browser li button { width: 100%; text-align: left; background: none; border: 0; border-left: 3px solid transparent; padding: 5px 14px 5px 11px; font-size: 14px; color: var(--ink); }
.browser li button:hover { background: #26282b; }
.browser li button[aria-current="true"] { border-left-color: var(--cat, var(--mustard)); background: #2c2d30; font-weight: 700; }
.browser .none { padding: 0 14px; font-size: 13px; color: var(--faint); }

/* empty state */
.welcome { grid-row: 1 / span 2; display: grid; place-items: center; padding: 40px 20px; }
.welcome .box { max-width: 460px; text-align: center; display: grid; gap: 14px; justify-items: center; }
.welcome h1 { margin: 0; font-size: 28px; font-weight: 700; }
.welcome p { margin: 0; color: var(--muted); font-size: 15px; line-height: 1.55; }
.welcome .err { color: var(--danger); }
.welcome .knobdeco { width: 96px; height: 96px; }

/* status bar */
.status { display: flex; align-items: center; gap: 18px; padding: 6px 16px; background: var(--rail); border-top: 1px solid #000; font-size: 13px; color: var(--muted); min-height: 32px; }
.status .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--faint); margin-right: 7px; vertical-align: 0; }
.status .dot.ok { background: var(--ok); }
.status .dot.busy { background: var(--mustard); }
.status .dot.err { background: var(--danger); }
.status .last { flex: 1; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.status button { background: none; border: 0; color: var(--muted); font-size: 13px; padding: 2px 4px; }
.status button:hover { color: var(--ink); }
.drawer { position: fixed; left: 0; right: 0; bottom: 32px; height: 38vh; background: #151618; border-top: 1px solid var(--line); z-index: 40; display: grid; grid-template-rows: auto 1fr; }
.drawer header { display: flex; align-items: center; gap: 10px; padding: 8px 16px; font-size: 13px; color: var(--muted); }
.drawer header strong { color: var(--ink); font-weight: 600; }
.drawer pre { margin: 0; padding: 4px 16px 14px; overflow: auto; font: 12px/1.6 var(--lcd); color: #b9b6ad; white-space: pre-wrap; word-break: break-all; }

@media (max-width: 1100px) {
  .inspector { grid-template-columns: minmax(0, 1fr) 200px; }
}
@media (max-width: 860px) {
  .body { grid-template-columns: minmax(0, 1fr); }
  .patches { position: fixed; z-index: 35; top: 0; bottom: 32px; left: 0; width: min(280px, 86vw); transform: translateX(-100%); box-shadow: 8px 0 30px rgba(0,0,0,.5); }
  .patches.anim { transition: transform .2s; }
  .patches.open { transform: none; }
  .inspector { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); }
  .browser { border-left: 0; border-bottom: 1px solid #000; max-height: 168px; padding-top: 10px; }
  .browser ul { display: flex; flex-wrap: wrap; gap: 4px; padding: 0 12px; }
  .browser li button { border: 1px solid var(--line); border-radius: 5px; padding: 3px 9px; }
  .browser li button[aria-current="true"] { border-color: var(--cat, var(--mustard)); }
  .inspector .browser { order: -1; }
  .views { margin-left: 0; overflow-x: auto; min-width: 0; flex: 1 1 100%; }
  .insp-head { min-width: 0; }
}
@media (min-width: 861px) { #btnPatches { display: none; } }
@media (max-width: 560px) {
  .top { gap: 8px; padding: 8px 12px; }
  .lcd input { width: 12ch; font-size: 16px; }
  .railwrap { padding-left: 16px; padding-right: 16px; }
  .ctls { padding-left: 16px; padding-right: 16px; }
  .ctl.wide { width: 100%; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <button class="tbtn" id="btnPatches" aria-controls="patches">パッチ</button>
    <div class="brand"><span>GP-10</span> Editor</div>
    <div class="lcd" title="現在のパッチ（テンポラリ）。名前は直接書き換えられます">
      <span class="no" id="patchNo">--</span>
      <input id="patchName" maxlength="12" spellcheck="false" autocomplete="off" placeholder="未接続" aria-label="パッチ名" disabled>
    </div>
    <span class="spacer"></span>
    <label class="toggle" title="本体側でつまみを回した変更を、1.5秒ごとに読み直して反映します"><input type="checkbox" id="chkSync"><span class="sw"></span>本体と同期</label>
    <button class="tbtn" id="btnReload" disabled>読み直す</button>
    <button class="tbtn" id="btnExport" disabled>.syxに保存</button>
    <button class="tbtn" id="btnImport" disabled>.syxを開く</button>
    <input type="file" id="fileSyx" accept=".syx,application/octet-stream" hidden>
    <div class="pop">
      <button class="tbtn" id="btnMidi" aria-expanded="false" aria-controls="midiPanel">MIDI設定</button>
      <div class="pop-panel" id="midiPanel" hidden>
        <label>入力（GP-10 → PC）<select id="selIn"></select></label>
        <label>出力（PC → GP-10）<select id="selOut"></select></label>
        <label>Device ID（16進）<input id="inDev" value="10"></label>
        <label>パッチ切り替えに使うMIDIチャンネル<select id="selCh"></select></label>
        <p>ポートは「GP-10」を選びます（「GP-10 DAW CTRL」ではありません）。</p>
      </div>
    </div>
    <button class="tbtn primary" id="btnConnect">接続</button>
  </header>

  <div class="body">
    <aside class="patches" id="patches" aria-label="パッチ一覧">
      <div class="patches-head"><h2>パッチ</h2><button class="tbtn" id="btnNames" disabled>名前を読む</button></div>
      <input class="search" id="patchSearch" type="search" placeholder="名前で絞り込む" aria-label="パッチを名前で絞り込む">
      <ul class="plist" id="patchList"><li class="hint">接続すると、ここに99パッチが並びます。クリックで本体のパッチを切り替えます。</li></ul>
    </aside>

    <main class="work">
      <section class="welcome" id="welcome">
        <div class="box">
          <svg class="knobdeco" viewBox="0 0 64 64" aria-hidden="true"><path d="M 13.4 50.6 A 26 26 0 1 1 50.6 50.6" fill="none" stroke="#17181a" stroke-width="5" stroke-linecap="round"/><path d="M 13.4 50.6 A 26 26 0 0 1 45 9.5" fill="none" stroke="#e2a72e" stroke-width="5" stroke-linecap="round"/><circle cx="32" cy="32" r="19" fill="#17181a"/><circle cx="32" cy="32" r="18" fill="none" stroke="#2f3135" stroke-width="2"/><line x1="32" y1="32" x2="40.6" y2="16.8" stroke="#e8e4da" stroke-width="3" stroke-linecap="round"/></svg>
          <h1>GP-10をつないでください</h1>
          <p>USBでつないだGP-10の現在のパッチを、ここで直接編集できます。ChromeかEdgeで開き、右上の「接続」を押して、MIDIデバイスの使用を許可してください。GP-10のドライバが必要です。</p>
          <p id="envNotice" class="err" hidden></p>
          <button class="tbtn primary" id="btnConnect2">GP-10に接続</button>
        </div>
      </section>

      <section class="railwrap" id="railwrap" hidden aria-label="信号経路">
        <div class="rail" id="rail"></div>
        <div class="railnote">ブロックをクリックで編集、ダブルクリックか右上のボタンでON/OFF、ドラッグで並べ替え。</div>
      </section>
      <section class="inspector" id="inspector" hidden>
        <div class="insp-main">
          <div class="insp-head">
            <div class="insp-title"><span class="bar"></span><h2 id="inspTitle"></h2><span class="model" id="inspModel"></span></div>
            <span id="inspPower"></span>
            <nav class="views" id="views" aria-label="パッチ全体の設定"></nav>
          </div>
          <div class="ctls" id="ctls"></div>
        </div>
        <aside class="browser" id="browser" aria-label="モデル"></aside>
      </section>
    </main>
  </div>

  <footer class="status">
    <span><span class="dot" id="dot"></span><span id="statusText">未接続</span></span>
    <span class="last" id="lastAction"></span>
    <span id="pendingInfo"></span>
    <button id="btnLog" aria-expanded="false" aria-controls="drawer">通信ログ</button>
  </footer>
  <div class="drawer" id="drawer" hidden>
    <header><strong>通信ログ</strong><span id="logCount"></span><span class="spacer"></span><button class="tbtn" id="btnLogClear">消去</button><button class="tbtn" id="btnLogClose">閉じる</button></header>
    <pre id="log"></pre>
  </div>
</div>

<script>
(() => {
  'use strict';
  const DATA = /*__GP10_DATA__*/null;
  const $ = (id) => document.getElementById(id);

  // ---------- SysEx helpers ----------
  const MODEL = [0x00, 0x00, 0x00, 0x05];
  const TEMP = [0x20, 0x00, 0x00, 0x00];
  const h2 = (b) => b.toString(16).toUpperCase().padStart(2, '0');

  const ARC = 270; const START = 135;

  function knobSVG(frac, centered) {
    const a0 = START + 90; const aEnd = a0 + ARC;
    const val = a0 + ARC * frac;
    const mid = a0 + ARC / 2;

    const [ix, iy] = polar(val, 15);
    return `<svg viewBox="0 0 64 64" aria-hidden="true">
      <path class="trk" d="${arcPath(a0, aEnd, 28)}" fill="none" stroke-width="5" stroke-linecap="round"/>
      ${to - from > 0.5 ? `<path class="val" d="${arcPath(from, to, 28)}" fill="none" stroke-width="5" stroke-linecap="round"/>` : ''}
      <circle cx="32" cy="32" r="20.5" fill="#101112"/>
      <circle cx="32" cy="32" r="19" fill="var(--knob-body)" stroke="#2f3135" stroke-width="2"/>
      <circle cx="32" cy="31" r="15" fill="none" stroke="rgba(255,255,255,.05)" stroke-width="1"/>
      <line x1="32" y1="32" x2="${ix.toFixed(2)}" y2="${iy.toFixed(2)}" stroke="#ece7db" stroke-width="3" stroke-linecap="round"/>
    </svg>`;
  }
  function makeControl(p, label) {

  }

      let base = a2i(r.addr);
      if (base >= TEMP_BASE + SPAN && base < TEMP_BASE + SPAN * 100) base = TEMP_BASE + ((base - TEMP_BASE) % SPAN);

      const pick = ports.find((p) => p.id === prev) || ports.find((p) => /GP-?10/i.test(p.name) && !/DAW/i.test(p.name)) || ports.find((p) => /GP-?10/i.test(p.name)) || ports[0];

    catch (e) { envError(`MIDIデバイスの使用が許可されませんでした（${e.name}）。アドレスバーのサイト設定でMIDIを許可してから、もう一度接続してください。`); setStatus('MIDIが許可されていません', 'err'); return; }

    });
  }
  function waitIdentity(ms) {
    return new Promise((resolve) => {
      const prev = S.input.onmidimessage; let done = false;
      S.input.onmidimessage = (e) => {
        const b = Array.from(e.data);
        if (!done && b[0] === 0xF0 && b[1] === 0x7E && b[3] === 0x06 && b[4] === 0x02) { done = true; S.input.onmidimessage = prev; resolve(b); return; }
        if (prev) prev(e);
      };
      setTimeout(() => { if (!done) { done = true; S.input.onmidimessage = prev; resolve(null); } }, ms);
    });
  }

  // ---------- wiring ----------
  $('btnConnect').onclick = connect; $('btnConnect2').onclick = connect;
  $('selIn').onchange = bind; $('selOut').onchange = bind;
  $('btnReload').onclick = () => enqueue(async () => { await readCurrentNo(); await readTemp(); last('本体から読み直しました'); });
  $('btnNames').onclick = () => enqueue(readNames);
  $('btnPatches').onclick = () => { $('patches').classList.add('anim'); $('patches').classList.toggle('open'); };
  $('btnMidi').onclick = (e) => { e.stopPropagation(); const p = $('midiPanel'); p.hidden = !p.hidden; $('btnMidi').setAttribute('aria-expanded', String(!p.hidden)); };
  document.addEventListener('click', (e) => { const p = $('midiPanel'); if (!p.hidden && !p.contains(e.target)) { p.hidden = true; $('btnMidi').setAttribute('aria-expanded', 'false'); } });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { $('midiPanel').hidden = true; $('drawer').hidden = true; $('patches').classList.remove('open'); } });
  $('btnLog').onclick = () => { const d = $('drawer'); d.hidden = !d.hidden; $('btnLog').setAttribute('aria-expanded', String(!d.hidden)); if (!d.hidden) { $('log').textContent = logLines.join('\n'); $('log').scrollTop = $('log').scrollHeight; } };
  $('btnLogClose').onclick = () => { $('drawer').hidden = true; $('btnLog').setAttribute('aria-expanded', 'false'); };
  $('btnLogClear').onclick = () => { logLines.length = 0; $('log').textContent = ''; $('logCount').textContent = ''; };
  $('chkSync').onchange = () => {
    store.set('sync', $('chkSync').checked ? '1' : '0');
    clearInterval(S.syncTimer);
    if ($('chkSync').checked) S.syncTimer = setInterval(() => { if (S.output && S.loaded && !S.collector && !S.pending.size) enqueue(readTemp); }, 1500);
  };
  $('chkSync').checked = store.get('sync', '0') === '1'; $('chkSync').onchange();
  $('inDev').value = store.get('dev', '10'); $('inDev').onchange = () => store.set('dev', $('inDev').value);
  for (let c = 0; c < 16; c++) $('selCh').add(new Option(`ch ${c + 1}`, String(c)));
  $('selCh').value = store.get('ch', '0'); $('selCh').onchange = () => store.set('ch', $('selCh').value);
  if (!('requestMIDIAccess' in navigator)) envError('このブラウザはWeb MIDIに対応していません。ChromeかEdgeで開いてください。');
  else if (!window.isSecureContext) envError('HTTPSかローカルファイルとして開いてください。この状態ではWeb MIDIが使えません。');

  window.__gp10ed = { S, BLOCKS, B, P, getVal, display, visible, select, V };
})();
